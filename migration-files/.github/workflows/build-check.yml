name: Build and Lint Check
on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm install
        
      - name: Run build
        run: npm run build
        
      - name: Run lint
        run: npm run lint
